<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>系统主界面｜康护通陪护管理信息系统</title>
<link rel="icon" href="../assets/img/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="admin.css">
</head>
<body data-page="home" data-title="系统主界面" data-crumb="系统主界面 › 工作台">
<main>
  <div class="kpis">
    <div class="kpi"><span>今日在护订单</span><strong data-kpi="active">0</strong><em>状态为“服务中”</em></div>
    <div class="kpi is-warn"><span>待派订单</span><strong data-kpi="pending">0</strong><em>需尽快派单（目标 15 分钟内）</em></div>
    <div class="kpi is-alert"><span>异常预警</span><strong data-kpi="alerts">0</strong><em>未处理</em></div>
    <div class="kpi is-teal"><span>在岗护工</span><strong data-kpi="carers">0</strong><em>有在护订单 / 在岗总数</em></div>
  </div>
  <section class="panel" id="todo">
    <h2 class="panel-title">待办事项 <span class="aside" id="todo-count"></span></h2>
    <div class="table-wrap"><table class="data">
      <thead><tr><th>订单编号</th><th>患者</th><th>科室床位</th><th>护理等级</th><th>状态</th><th>操作</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </section>
  <section class="panel">
    <h2 class="panel-title">常用功能</h2>
    <div class="quick">
      <a href="booking.html"><b>预约受理</b><span>登记陪护需求，自动计算费用</span></a>
      <a href="dispatch.html"><b>智能派单</b><span>按匹配分推荐护工</span></a>
      <a href="orders.html"><b>订单查询</b><span>筛选、合计、导出 Excel</span></a>
      <a href="stats.html"><b>运营统计</b><span>订单、收入、满意度</span></a>
    </div>
  </section>
  <p class="notice"><b>系统公告</b><span>① 本月起骨科、神经内科陪护单价按价格政策执行；② 本周五 16:00 新入职护工院感培训考核；③ 演示数据保存在本机浏览器中，可在“系统管理 › 数据备份”中重置。</span></p>
</main>
<script src="admin.js"></script>
</body>
</html>
